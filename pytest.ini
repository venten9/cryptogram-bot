[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: Tier 1 pure mathematical and invariant unit tests
    boundary: Tier 2 boundary, edge-case, and pathological input tests
    catalog: Tests validating pre-configured dispatches and quotes
    database: Tier 3 async persistence and SQLAlchemy tests
    e2e: Tier 4 headless bot simulation tests
filterwarnings =
    ignore::DeprecationWarning
